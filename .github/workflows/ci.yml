name: CI

on:
  push:
    branches: [tokoonline, "fix/**"]
  pull_request:
    branches: [tokoonline]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/toko_online?schema=public
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
      AUTH_URL: http://localhost:3000
      MIDTRANS_SERVER_KEY: ci-server-key
      MIDTRANS_CLIENT_KEY: ci-client-key
      MIDTRANS_IS_PRODUCTION: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toko_online
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d toko_online"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run build
